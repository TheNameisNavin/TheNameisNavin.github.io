<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navin's Space</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background-color: black;
    color: #E0E0E0;
    font-family: 'Share Tech Mono', monospace;
    overflow-x: hidden;
}

/* Matrix canvas background */
#matrix {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

/* NAVBAR */
nav {
    background-color: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(6px);
    padding: 1rem;
    text-align: center;
    border-bottom: 1px solid rgba(0,255,159,0.25);
}

nav a {
    margin: 0 1.2rem;
    color: #00FF9F;
    text-decoration: none;
    font-size: 1.6rem;
    font-family: 'Orbitron', sans-serif;
    transition: 0.3s ease;
}

nav a:hover {
    color: white;
    text-shadow: 0 0 8px #00FF9F, 0 0 18px #00FF9F;
    transform: scale(1.1);
}

/* CONTENT CONTAINER */
.container {
    padding: 2rem;
    max-width: 800px;
    margin: 4rem auto;
    text-align: center;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(4px);
    border-radius: 14px;
    box-shadow: 0 0 25px rgba(0,255,159,0.15);
}

/* HEADINGS */
h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 3.3rem;
    color: #00FF9F;
    text-shadow: 0 0 8px #00FF9F, 0 0 20px #00FF9F;
    transition: transform 0.3s ease;
}

h1:hover {
    transform: translateY(-10px);
}

/* PARAGRAPH */
p {
    font-size: 1.8rem;
    color: #E0E0E0;
}

/* LINK ACCENT COLOR */
a {
    color: #00E5FF;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<nav>
    <a href="about.html" class="hover-sound">About Me</a>
    <a href="projects.html" class="hover-sound">Projects</a>
    <a href="work.html" class="hover-sound">Work Experience</a>
    <a href="blog.html" class="hover-sound">Technology Stacks</a>
    <a href="testimonials.html" class="hover-sound">Testimonials</a>
    <a href="contact.html" class="hover-sound">Contact</a>
</nav>

<audio id="hover-sound" src="https://css-tricks.com/examples/SoundOnHover/audio/beep.mp3"></audio>

<div class="container">
    <h1>Greetings! I'm Navin.</h1>
    <p>Welcome to my digital space.</p>
</div>

<script>
/* Hover sound */
document.querySelectorAll('.hover-sound').forEach(link => {
    link.addEventListener('mouseover', () => {
        document.getElementById('hover-sound').play();
    });
});

/* MATRIX RAIN EFFECT */

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "アァイィウヴエカキクケコサシスセソ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const matrix = letters.split("");

const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = [];

for (let x = 0; x < columns; x++) {
    drops[x] = 1;
}

function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00FF9F";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
        const text = matrix[Math.floor(Math.random() * matrix.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
        }
        drops[i]++;
    }
}

setInterval(drawMatrix, 33);

window.addEventListener("resize", () => {
    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;
});
</script>

</body>
</html>
