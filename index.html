<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navin's Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            color: #ffffff;
        }
        
        .gif-container {
            margin: 20px auto;
            width: 400px;
        }
        nav {
            background-color: #1f1f1f;
            padding: 1rem;
            text-align: center;
        }
        nav a {
            margin: 0 1rem;
            color: #F56040;
            text-decoration: none;
            font-size: 1.2rem;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .container {
            padding: 2rem;
            max-width: 800px;
            margin: auto;
        }
        h1 {
            text-align: center;
            font-size: 2.6rem;
            color: #FFDC80;
        }
    
        p {
            font-size: 1.2rem;
            color: #aaaaaa;
        }
    </style>
</head>
<body>

    <nav>
        <a href="about.html" class="hover-sound">About Me</a>
        <a href="projects.html" class="hover-sound">Projects</a>
        <a href="blog.html" class="hover-sound">Blog</a>
        <a href="testimonials.html" class="hover-sound">Testimonials</a>
        <a href="contact.html" class="hover-sound">Contact</a>
    </nav>
    <audio id="hover-sound" src="https://css-tricks.com/examples/SoundOnHover/audio/beep.mp3"></audio>
    <script>
        // JavaScript code to play sound on hover
        document.querySelectorAll('.hover-sound').forEach(link => {
            link.addEventListener('mouseover', () => {
                const sound = document.getElementById('hover-sound');
                sound.play();
            });
        });
    </script>
    <div class="container">
        <h1>Welcome to My Website!!</h1>
        <p>Hey there!! Welcome to my space. Here, you'll find a blend of my projects,
        insights, and experiences. What are you waiting for? Let's Explore and connect!!</p>
            
    <div class="gif-container">
        <img src="https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExbHh0Z2Rma2o0bWN5ZG5zNGliejk0eHR3ejc0cThieW90Z3k5cHY5biZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/12B39IawiNS7QI/giphy.gif" alt="Funny GIF" width="400">
    </div>
</body>
</html>
