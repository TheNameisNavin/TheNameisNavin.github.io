<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navin's Space</title>

    <style>
        body {
            margin: 0;
            font-family: 'Futura', 'Arial', sans-serif;
            background-color: black;
            color: #00ff9f;
            overflow-x: hidden;
        }

        /* Matrix canvas background */
        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        nav {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 1rem;
            text-align: center;
        }

        nav a {
            margin: 0 1rem;
            color: #00ff9f;
            text-decoration: none;
            font-size: 1.8rem;
            transition: transform 0.3s ease, color 0.3s ease;
            display: inline-block;
        }

        nav a:hover {
            transform: scale(1.1);
            color: #ffffff;
        }

        .container {
            padding: 2rem;
            max-width: 800px;
            margin: auto;
            text-align: center;
        }

        h1 {
            font-size: 3.3rem;
            color: #00ff9f;
            transition: transform 0.3s ease;
        }

        h1:hover {
            transform: translateY(-10px);
        }

        p {
            font-size: 2rem;
            color: #b6ffe0;
        }
    </style>
</head>

<body>

<canvas id="matrix"></canvas>

<nav>
    <a href="about.html" class="hover-sound">About Me</a>
    <a href="projects.html" class="hover-sound">Projects</a>
    <a href="work.html" class="hover-sound">Work Experience</a>
    <a href="blog.html" class="hover-sound">Technology Stacks</a>
    <a href="testimonials.html" class="hover-sound">Testimonials</a>
    <a href="contact.html" class="hover-sound">Contact</a>
</nav>

<audio id="hover-sound" src="https://css-tricks.com/examples/SoundOnHover/audio/beep.mp3"></audio>

<div class="container">
    <h1>Hey there! I'm Navin.</h1>
    <p>Welcome to my profile!!</p>

    <img src="https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExNXR1YnRmeGRscHA0ZTlkandoYzMxOXNjMzVkdzEzbWNoM2ZxNGd5MiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/QYkX9IMHthYn0Y3pcG/giphy.gif"
         style="width: 100%; max-width: 400px; display: block; margin: 20px auto;">
</div>

<script>
/* Hover sound */
document.querySelectorAll('.hover-sound').forEach(link => {
    link.addEventListener('mouseover', () => {
        document.getElementById('hover-sound').play();
    });
});

/* MATRIX RAIN EFFECT */

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "アァイィウヴエカキクケコサシスセソ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const matrix = letters.split("");

const fontSize = 16;
const columns = canvas.width / fontSize;

const drops = [];

for (let x = 0; x < columns; x++) {
    drops[x] = 1;
}

function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00ff9f";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
        const text = matrix[Math.floor(Math.random() * matrix.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
        }

        drops[i]++;
    }
}

setInterval(drawMatrix, 33);

window.addEventListener("resize", () => {
    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;
});
</script>

</body>
</html>
