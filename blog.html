<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technology Stacks and skills</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            color: #ffffff;
            overflow-x: hidden;
        }

        nav {
            background-color: #1f1f1f;
            padding: 1rem;
            text-align: center;
        }

        nav a {
            margin: 0 1rem;
            color: #0F52BA;
            text-decoration: none;
            font-size: 1.8rem;
            transition: transform 0.3s ease, background-color 0.3s ease;
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 5px;
        }

        nav a:hover {
            transform: scale(1.1);
            background-color: #1E90FF;
            color: #ffffff;
        }

        .container {
            padding: 2rem;
            max-width: 1000px;
            margin: auto;
            position: relative;
        }

        h2 {
            text-align: center;
            font-size: 3.3rem;
            color: #3B99D8;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        h2:hover {
            transform: translateY(-10px);
            color: #5BB3E0;
        }

        .tech-stack-container {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            overflow: hidden;
            max-width: 100%;
            padding: 1rem 0;
            flex-wrap: wrap;
        }

        .tech-stack {
            padding: 1.5rem;
            border-radius: 10px;
            background-color: #1f1f1f;
            border: 2px solid #4caf50;
            color: #ffffff;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1 0 15%;
            transition: transform 0.3s ease, background-color 0.3s ease;
            white-space: nowrap; /* Prevent text wrapping */
            overflow: hidden; /* Prevent overflow */
            text-overflow: ellipsis; /* Truncate text */
            max-width: 150px; /* Set max width to avoid too large elements */
        }

        .tech-stack:hover {
            transform: scale(1.1);
            background-color: #4caf50;
        }

        .carousel-buttons {
            display: flex;
            justify-content: space-between;
            position: absolute;
            top: 50%;
            width: 100%;
        }

        .carousel-button {
            background-color: #4caf50;
            color: #000;
            border: none;
            padding: 1rem;
            border-radius: 50%; /* Circular shape */
            font-size: 2rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 50px; /* Set fixed width and height for a circular button */
            height: 50px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .carousel-button:hover {
            background-color: #ffffff;
            color: #4caf50;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #1f1f1f;
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            max-width: 500px;
            color: #ffffff;
        }

        .modal-content h3 {
            color: #4caf50;
        }

        .modal-content p {
            font-size: 1rem;
            margin: 1rem 0;
        }

        .close-btn {
            background-color: #4caf50;
            color: #000;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
        }

        .close-btn:hover {
            background-color: #ffffff;
            color: #4caf50;
        }

    </style>
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Me</a>
    <a href="projects.html">Projects</a>
    <a href="testimonials.html">Testimonials</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="container">
    <h2>Technology Stacks and Skills</h2>
    <div class="tech-stack-container" id="tech-stack-container">
        <!-- Technology Stacks (initially showing 7) -->
        <div class="tech-stack">Python</div>
        <div class="tech-stack">JavaScript</div>
        <div class="tech-stack">HTML5</div>
        <div class="tech-stack">CSS3</div>
        <div class="tech-stack">SQL</div>
        <div class="tech-stack">Linux</div>
        <div class="tech-stack">API</div>
    </div>

    <div class="carousel-buttons">
        <button class="carousel-button" onclick="moveCarousel(-1)">&#8249;</button>
        <button class="carousel-button" onclick="moveCarousel(1)">&#8250;</button>
    </div>
</div>

<!-- Modal -->
<div class="modal" id="tech-modal">
    <div class="modal-content">
        <h3 id="modal-title">Title</h3>
        <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
</div>

<script>
    const techStacks = [
        'Python', 'JavaScript', 'HTML5', 'CSS3', 'SQL', 'Linux', 'API',
        'VMware', 'Postman', 'Salesforce', 'ServiceNow', 'JSON/XML', 'Chat Support', 
        'Email Support', 'Call Support', 'Ticket handling'
    ];

    let currentIndex = 0;

    function moveCarousel(direction) {
        currentIndex += direction * 7;

        if (currentIndex < 0) {
            currentIndex = 0;
        }

        if (currentIndex >= techStacks.length) {
            currentIndex = techStacks.length - 7;
        }

        displayTechStacks();
    }

    function displayTechStacks() {
        const container = document.getElementById('tech-stack-container');
        container.innerHTML = '';

        for (let i = currentIndex; i < currentIndex + 7 && i < techStacks.length; i++) {
            const techStackDiv = document.createElement('div');
            techStackDiv.className = 'tech-stack';
            techStackDiv.textContent = techStacks[i];
            techStackDiv.onclick = function() { zoomCard(techStacks[i]); };
            container.appendChild(techStackDiv);
        }
    }

    function zoomCard(title) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('tech-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('tech-modal').style.display = 'none';
    }

    displayTechStacks(); // Initial display
</script>

</body>
</html>
