<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technology Stacks - Navin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
         body {
            margin: 0;
            font-family: 'Futura', 'Arial', sans-serif; /* Updated font-family */
            background-color: #121212;
            color: #ffffff;
            overflow-y: auto; /* Enable vertical scrolling */
        }

        nav {
            background-color: #1f1f1f;
            padding: 1rem;
            text-align: center;
        }

       nav a {
            margin: 0 1rem;
            color: #0F52BA;
            text-decoration: none;
            font-size: 1.8rem;
            transition: transform 0.3s ease, background-color 0.3s ease;
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 5px;
        }

        nav a:hover {
            transform: scale(1.1);
            background-color: #1E90FF;
            color: #ffffff;
        }
        .container {
            padding: 2rem;
            max-width: 1200px;
            margin: auto;
        }
        h2 {
            text-align: center;
            font-size: 3.3rem;
            color: #3B99D8;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s ease, color 0.3s ease;
        }
        h2:hover {
            transform: translateY(-10px);
            color: #5BB3E0;
        }
        .tech-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
        }

        .tech-card {
            background-color: #1f1f1f;
            border: 2px solid #4caf50;
            border-radius: 10px;
            text-align: center;
            padding: 1rem;
            transition: transform 0.3s ease, background-color 0.3s ease;
            cursor: pointer;
        }

        .tech-card:hover {
            transform: translateY(-10px);
            background-color: #4caf50;
            color: #000000;
        }

        .tech-card img {
            width: 80px;
            height: 80px;
            margin-bottom: 1rem;
        }

        .tech-card h3 {
            margin: 0.5rem 0;
            font-size: 1.2rem;
        }

        /* Modal Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #1f1f1f;
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            max-width: 500px;
            color: #ffffff;
        }

        .modal-content h3 {
            color: #4caf50;
        }

        .modal-content p {
            font-size: 1rem;
            margin: 1rem 0;
        }

        .close-btn {
            background-color: #4caf50;
            color: #000;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
        }

        .close-btn:hover {
            background-color: #ffffff;
            color: #4caf50;
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Me</a>
    <a href="projects.html">Projects</a>
    <a href="testimonials.html">Testimonials</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="container">
    <h2>Technology Stacks</h2>
    <div class="tech-grid">
        <div class="tech-card" onclick="showModal('Python', 'Python is a versatile programming language used for web development, data analysis, machine learning, and automation.')">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968350.png" alt="Python">
            <h3>Python</h3>
        </div>
        <div class="tech-card" onclick="showModal('JavaScript', 'JavaScript powers dynamic web development and interactive interfaces.')">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968292.png" alt="JavaScript">
            <h3>JavaScript</h3>
        </div>
        <div class="tech-card" onclick="showModal('HTML5', 'HTML5 is the backbone of web development, structuring content on the web.')">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968267.png" alt="HTML5">
            <h3>HTML5</h3>
        </div>
        <div class="tech-card" onclick="showModal('CSS3', 'CSS3 styles and enhances the visual presentation of websites.')">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968242.png" alt="CSS3">
            <h3>CSS3</h3>
        </div>
        <div class="tech-card" onclick="showModal('Linux', 'Linux is an open-source operating system, crucial for servers and development environments.')">
            <img src="https://cdn-icons-png.flaticon.com/512/226/226772.png" alt="Linux">
            <h3>Linux</h3>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal" id="tech-modal">
    <div class="modal-content">
        <h3 id="modal-title">Title</h3>
        <p id="modal-description">Description</p>
        <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
</div>

<script>
    function showModal(title, description) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-description').textContent = description;
        document.getElementById('tech-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('tech-modal').style.display = 'none';
    }
</script>

</body>
</html>
