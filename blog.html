<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technology Stacks - Navin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            color: #ffffff;
            overflow-x: hidden;
        }

        nav {
            background-color: #1f1f1f;
            padding: 1rem;
            text-align: center;
        }

        nav a {
            margin: 0 1rem;
            color: #4caf50;
            text-decoration: none;
            font-size: 1.2rem;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #ffffff;
        }

        .container {
            padding: 2rem;
            max-width: 1200px;
            margin: auto;
        }

        h2 {
            text-align: center;
            font-size: 2.5rem;
            color: #4caf50;
            margin-bottom: 2rem;
        }

        .tech-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
        }

        .tech-card {
            background-color: #1f1f1f;
            border: 2px solid #4caf50;
            border-radius: 10px;
            text-align: center;
            padding: 1rem;
            transition: transform 0.3s ease, background-color 0.3s ease;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tech-card:hover {
            transform: scale(1.2);
            background-color: #4caf50;
            color: #000000;
        }

        .tech-card img {
            width: 80px;
            height: 80px;
            margin-bottom: 1rem;
        }

        /* Modal Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #1f1f1f;
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            max-width: 500px;
            color: #ffffff;
        }

        .modal-content h3 {
            color: #4caf50;
        }

        .modal-content p {
            font-size: 1rem;
            margin: 1rem 0;
        }

        .close-btn {
            background-color: #4caf50;
            color: #000;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
        }

        .close-btn:hover {
            background-color: #ffffff;
            color: #4caf50;
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Me</a>
    <a href="projects.html">Projects</a>
    <a href="testimonials.html">Testimonials</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="container">
    <h2>Technology Stacks</h2>
    <div class="tech-grid">
        <!-- Python -->
        <div class="tech-card" onclick="zoomCard('Python')">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968350.png" alt="Python">
        </div>
        <!-- JavaScript -->
        <div class="tech-card" onclick="zoomCard('JavaScript')">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968292.png" alt="JavaScript">
        </div>
        <!-- HTML5 -->
        <div class="tech-card" onclick="zoomCard('HTML5')">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968267.png" alt="HTML5">
        </div>
        <!-- CSS3 -->
        <div class="tech-card" onclick="zoomCard('CSS3')">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968242.png" alt="CSS3">
        </div>
        <!-- Linux -->
        <div class="tech-card" onclick="zoomCard('Linux')">
            <img src="https://cdn-icons-png.flaticon.com/512/226/226772.png" alt="Linux">
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal" id="tech-modal">
    <div class="modal-content">
        <h3 id="modal-title">Title</h3>
        <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
</div>

<script>
    function zoomCard(title) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('tech-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('tech-modal').style.display = 'none';
    }
</script>

</body>
</html>
