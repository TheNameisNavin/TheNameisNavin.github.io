<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technology Stacks and Skills</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* ===== GLOBAL ===== */
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: #e6f7ff;
    background: radial-gradient(circle at 50% 20%, #020617 0%, #000000 80%);
    overflow-x: hidden;
}

/* ===== STAR BACKGROUND ===== */
.stars, .stars2 {
    position: fixed;
    width: 100%;
    height: 100%;
    background-repeat: repeat;
    z-index: -1;
}

.stars {
    background-image: radial-gradient(2px 2px at 20px 30px, white, transparent),
                      radial-gradient(1px 1px at 200px 150px, white, transparent),
                      radial-gradient(2px 2px at 400px 80px, white, transparent);
    animation: moveStars 120s linear infinite;
}

.stars2 {
    background-image: radial-gradient(1px 1px at 50px 100px, #00f0ff, transparent),
                      radial-gradient(2px 2px at 300px 200px, #7fe7ff, transparent);
    animation: moveStars 200s linear infinite;
}

@keyframes moveStars {
    from { transform: translateY(0); }
    to { transform: translateY(-2000px); }
}

/* ===== NAV ===== */
nav {
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
    padding: 1rem;
    text-align: center;
}

nav a {
    margin: 0 1rem;
    color: #7fe7ff;
    text-decoration: none;
    font-size: 1.6rem;
    font-family: 'Orbitron', sans-serif;
    transition: 0.3s;
}

nav a:hover {
    color: white;
    text-shadow: 0 0 12px #00f0ff;
}

/* ===== CLOCK ===== */
#clockBox {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    padding: 14px 22px;
    border: 2px solid #00f0ff;
    border-radius: 10px;
    background: rgba(0,0,0,0.65);
    box-shadow: 0 0 25px rgba(0,240,255,0.5);
}

#clock {
    font-size: 1.7rem;
    letter-spacing: 2px;
    font-family: 'Orbitron', sans-serif;
}

/* ===== MAIN ===== */
.container {
    padding: 2rem;
    max-width: 1100px;
    margin: auto;
}

h2 {
    text-align: center;
    font-size: 3rem;
    font-family: 'Orbitron', sans-serif;
    color: #7fe7ff;
    margin-bottom: 2rem;
}

/* ===== UFO CONTAINER ===== */
.tech-stack-container {
    display: flex;
    justify-content: space-evenly;
    flex-wrap: wrap;
    gap: 30px;
}

/* ===== UFO ===== */
.ufo {
    width: 140px;
    text-align: center;
    cursor: pointer;
    animation: float 4s ease-in-out infinite;
}

.ufo:nth-child(even) { animation-delay: 1s; }

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

.ufo-body {
    width: 140px;
    height: 40px;
    background: linear-gradient(to right, #00f0ff, #7fe7ff);
    border-radius: 50%;
    box-shadow: 0 0 25px rgba(0,240,255,0.7);
}

.ufo-dome {
    width: 70px;
    height: 40px;
    background: rgba(255,255,255,0.2);
    margin: auto;
    border-radius: 50% 50% 0 0;
    border: 1px solid #7fe7ff;
}

.skill-text {
    margin-top: 8px;
    font-size: 1rem;
    color: #e6f7ff;
}

/* ===== CAROUSEL BUTTONS ===== */
.carousel-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 2rem;
}

.carousel-button {
    background: #00f0ff;
    border: none;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    font-size: 2rem;
    cursor: pointer;
}

/* ===== MODAL ===== */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: #020617;
    padding: 2rem;
    border-radius: 10px;
    border: 1px solid #00f0ff;
    text-align: center;
}

</style>
</head>

<body>

<div class="stars"></div>
<div class="stars2"></div>

<div id="clockBox"><div id="clock"></div></div>

<nav>
<a href="index.html" class="hover-sound">Home</a>
<a href="about.html" class="hover-sound">About Me</a>
<a href="work.html" class="hover-sound">Work Experience</a>
<a href="projects.html" class="hover-sound">Projects</a>
<a href="testimonials.html" class="hover-sound">Testimonials</a>
<a href="contact.html" class="hover-sound">Contact</a>
</nav>

<audio id="hover-sound" src="https://css-tricks.com/examples/SoundOnHover/audio/beep.mp3"></audio>

<div class="container">
<h2>Tech Stacks and Skills</h2>

<div class="tech-stack-container" id="tech-stack-container"></div>

<div class="carousel-buttons">
<button class="carousel-button" onclick="moveCarousel(-1)">‹</button>
<button class="carousel-button" onclick="moveCarousel(1)">›</button>
</div>

</div>

<div class="modal" id="tech-modal">
<div class="modal-content">
<h3 id="modal-title"></h3>
<button onclick="closeModal()">Close</button>
</div>
</div>

<script>

/* CLOCK */
function updateClock() {
    document.getElementById("clock").innerText =
        new Date().toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

/* NAV SOUND */
document.querySelectorAll('.hover-sound').forEach(link => {
    link.addEventListener('mouseover', () => {
        document.getElementById('hover-sound').play();
    });
});

/* SKILLS */
const techStacks = [
'Python','JavaScript','HTML5','CSS3','SQL','Linux','API',
'ServiceNow','Freshservice','Postman','JSON/XML','SaaS Support',
'Automation','REST API','Networking','Cyber Security'
];

let currentIndex = 0;

function moveCarousel(direction) {
    currentIndex += direction * 6;
    if (currentIndex < 0) currentIndex = 0;
    if (currentIndex >= techStacks.length) currentIndex = techStacks.length - 6;
    displayTechStacks();
}

function displayTechStacks() {
    const container = document.getElementById('tech-stack-container');
    container.innerHTML = '';

    for (let i = currentIndex; i < currentIndex + 6 && i < techStacks.length; i++) {

        const ufo = document.createElement('div');
        ufo.className = 'ufo';
        ufo.onclick = () => zoomCard(techStacks[i]);

        ufo.innerHTML = `
            <div class="ufo-dome"></div>
            <div class="ufo-body"></div>
            <div class="skill-text">${techStacks[i]}</div>
        `;

        container.appendChild(ufo);
    }
}

function zoomCard(title) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('tech-modal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('tech-modal').style.display = 'none';
}

displayTechStacks();

</script>

</body>
</html>
