<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonials</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Futura', 'Arial', sans-serif;
            background-color: #121212;
            color: #ffffff;
        }

        nav {
            background-color: #1f1f1f;
            padding: 1rem;
            text-align: center;
        }

        nav a {
            margin: 0 1rem;
            color: #0F52BA;
            text-decoration: none;
            font-size: 1.8rem;
            transition: transform 0.3s ease, background-color 0.3s ease;
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 5px;
        }

        nav a:hover {
            transform: scale(1.1);
            background-color: #1E90FF;
            color: #ffffff;
        }

        .carousel {
            display: flex;
            overflow: hidden;
            width: 80%;
            margin: 2rem auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .carousel-track {
            display: flex;
            animation: scroll 10s linear infinite; /* Slowed down the animation */
        }

        .carousel-item {
            min-width: 100%;
        }

        .carousel-item img {
            width: 100%;
            border-radius: 10px;
            display: block;
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Me</a>
    <a href="projects.html">Projects</a>
    <a href="blog.html">Blog</a>
    <a href="contact.html">Contact</a>
</nav>

<h1 style="text-align: center; color: #3B99D8;">Testimonials updated</h1>

<div class="carousel">
    <div class="carousel-track">
        <!-- First Image -->
        <div class="carousel-item">
            <img src="images/Screenshot_2023-01-12./800x400.png" alt="Testimonial Screenshot">
        </div>
        <!-- Additional placeholders for future testimonials -->
        <div class="carousel-item">
            <img src="https://via.placeholder.com/800x400.png?text=Testimonial+2" alt="Testimonial 2">
        </div>
        <div class="carousel-item">
            <img src="https://via.placeholder.com/800x400.png?text=Testimonial+3" alt="Testimonial 3">
        </div>
    </div>
</div>

</body>
</html>
