<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonials</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Futura', 'Arial', sans-serif;
            background-color: #121212;
            color: #ffffff;
        }

        nav {
            background-color: #1f1f1f;
            padding: 1rem;
            text-align: center;
        }

        nav a {
            margin: 0 1rem;
            color: #0F52BA;
            text-decoration: none;
            font-size: 1.8rem;
            transition: transform 0.3s ease, background-color 0.3s ease;
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 5px;
        }

        nav a:hover {
            transform: scale(1.1);
            background-color: #1E90FF;
            color: #ffffff;
        }

        .carousel {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80%;
            margin: 2rem auto;
            position: relative;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
            width: 100%;
        }

        .carousel-item {
            min-width: 100%;
            display: flex;
            justify-content: center;
        }

        .carousel-item img {
            width: 80%;
            max-width: 800px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .carousel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            font-size: 2rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            z-index: 1000;
        }

        .carousel-arrow.left {
            left: 10px;
        }

        .carousel-arrow.right {
            right: 10px;
        }

        .carousel-arrow:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
        h2 {
            text-align: center;
            font-size: 3.3rem;
            color: #3B99D8;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s ease, color 0.3s ease;
        }
        h2:hover {
            transform: translateY(-10px);
            color: #5BB3E0;
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="hover-sound">Home</a>
    <a href="about.html" class="hover-sound">About Me</a>
    <a href="projects.html" class="hover-sound">Projects</a>
    <a href="blog.html" class="hover-sound">Technology Stacks</a>
    <a href="contact.html" class="hover-sound">Contact</a>
</nav>
<audio id="hover-sound" src="https://css-tricks.com/examples/SoundOnHover/audio/beep.mp3"></audio>
    <script>
        // JavaScript code to play sound on hover
        document.querySelectorAll('.hover-sound').forEach(link => {
            link.addEventListener('mouseover', () => {
                const sound = document.getElementById('hover-sound');
                sound.play();
            });
        });
    </script>
<h2>Testimonials</h2>

<div class="carousel">
    <button class="carousel-arrow left" onclick="moveCarousel(-1)">&#8249;</button>
    <div class="carousel-track" id="carousel-track">
        <!-- First Image -->
        <div class="carousel-item">

        </div>
        <div class="carousel-item">

        </div>
        <div class="carousel-item">

        <div class="carousel-item">

         <div class="carousel-item">

    </div>
    <button class="carousel-arrow right" onclick="moveCarousel(1)">&#8250;</button>
</div>

<script>
    let currentIndex = 0;

    function moveCarousel(direction) {
        const track = document.getElementById('carousel-track');
        const items = document.querySelectorAll('.carousel-item');
        const totalItems = items.length;

        // Update index
        currentIndex = (currentIndex + direction + totalItems) % totalItems;

        // Move the carousel
        track.style.transform = `translateX(-${currentIndex * 100}%)`;
    }
</script>

</body>
</html>
