<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimonials</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* ===== MATRIX BACKGROUND ===== */
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: #d8ffe1;
    background: radial-gradient(circle at center, #020403 0%, #000000 90%);
    overflow-x: hidden;
}

/* Matrix rain effect */
.matrix-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    opacity: 0.15;
    background-image: repeating-linear-gradient(
        to bottom,
        rgba(0,255,120,0.08) 0px,
        rgba(0,255,120,0.08) 1px,
        transparent 2px,
        transparent 4px
    );
    animation: matrixMove 20s linear infinite;
}

@keyframes matrixMove {
    from { background-position-y: 0; }
    to { background-position-y: 200px; }
}

/* ===== NAV ===== */
nav {
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    padding: 1rem;
    text-align: center;
    border-bottom: 1px solid rgba(0,255,140,0.2);
}

nav a {
    margin: 0 1rem;
    color: #4dffb8;
    text-decoration: none;
    font-size: 1.6rem;
    font-family: 'Orbitron', sans-serif;
    transition: 0.3s;
}

nav a:hover {
    color: white;
    text-shadow: 0 0 10px #00ff9d;
}

/* ===== TITLE ===== */
h2 {
    text-align: center;
    font-size: 3rem;
    font-family: 'Orbitron', sans-serif;
    color: #7affc4;
    margin-top: 2rem;
    margin-bottom: 1.5rem;
}

/* ===== CAROUSEL ===== */
.carousel {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 85%;
    margin: 2rem auto;
    position: relative;
}

.carousel-track {
    display: flex;
    transition: transform 0.5s ease-in-out;
    width: 100%;
}

.carousel-item {
    min-width: 100%;
    display: flex;
    justify-content: center;
}

.carousel-item img {
    width: 75%;
    max-width: 820px;
    border-radius: 10px;
    border: 1px solid rgba(0,255,140,0.25);
    box-shadow: 0 0 25px rgba(0,255,140,0.15);
}

/* ===== ANCIENT ARROW BUTTONS ===== */
.carousel-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
}

.carousel-arrow svg {
    width: 60px;
    height: 60px;
    filter: drop-shadow(0 0 6px #00ff9d);
    transition: 0.3s;
}

.carousel-arrow:hover svg {
    transform: scale(1.2);
    filter: drop-shadow(0 0 12px #00ff9d);
}

.carousel-arrow.left { left: 10px; }
.carousel-arrow.right { right: 10px; }

</style>
</head>

<body>

<div class="matrix-bg"></div>

<nav>
<a href="index.html" class="hover-sound">Home</a>
<a href="about.html" class="hover-sound">About Me</a>
<a href="work.html" class="hover-sound">Work Experience</a>
<a href="projects.html" class="hover-sound">Projects</a>
<a href="blog.html" class="hover-sound">Technology Stacks</a>
<a href="contact.html" class="hover-sound">Contact</a>
</nav>

<audio id="hover-sound" src="https://css-tricks.com/examples/SoundOnHover/audio/beep.mp3"></audio>

<h2>Testimonials</h2>

<div class="carousel">

<!-- LEFT ARROW -->
<button class="carousel-arrow left" onclick="moveCarousel(-1)">
<svg viewBox="0 0 100 100">
<polygon points="70,10 30,50 70,90 60,50" fill="#7affc4"/>
</svg>
</button>

<div class="carousel-track" id="carousel-track">

<div class="carousel-item"><img src="images/de2.png"></div>
<div class="carousel-item"><img src="images/csat1.png"></div>
<div class="carousel-item"><img src="images/csat2.png"></div>
<div class="carousel-item"><img src="images/csat3.png"></div>
<div class="carousel-item"><img src="images/csat4.png"></div>
<div class="carousel-item"><img src="images/csat5.png"></div>
<div class="carousel-item"><img src="images/csat6.png"></div>
<div class="carousel-item"><img src="images/csat7.png"></div>
<div class="carousel-item"><img src="images/csat8.png"></div>
<div class="carousel-item"><img src="images/csat9.png"></div>
<div class="carousel-item"><img src="images/csat10.png"></div>
<div class="carousel-item"><img src="images/csat11.png"></div>
<div class="carousel-item"><img src="images/ru1.png"></div>

</div>

<!-- RIGHT ARROW -->
<button class="carousel-arrow right" onclick="moveCarousel(1)">
<svg viewBox="0 0 100 100">
<polygon points="30,10 70,50 30,90 40,50" fill="#7affc4"/>
</svg>
</button>

</div>

<script>

/* HOVER SOUND */
document.querySelectorAll('.hover-sound').forEach(link => {
    link.addEventListener('mouseover', () => {
        document.getElementById('hover-sound').play();
    });
});

/* CAROUSEL */
let currentIndex = 0;

function moveCarousel(direction) {
    const track = document.getElementById('carousel-track');
    const items = document.querySelectorAll('.carousel-item');
    const totalItems = items.length;

    currentIndex = (currentIndex + direction + totalItems) % totalItems;
    track.style.transform = `translateX(-${currentIndex * 100}%)`;
}

</script>

</body>
</html>
