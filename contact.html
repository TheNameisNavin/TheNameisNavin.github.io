<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Navin</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ===== BASE ===== */
body {
    margin: 0;
    font-family: 'Rajdhani', sans-serif;
    background: #000;
    color: #9dfcff;
}

/* ===== MATRIX NAV ===== */
nav {
    background: rgba(0,0,0,0.85);
    padding: 1.3rem;
    text-align: center;
    border-bottom: 1px solid #00ffcc;
    box-shadow: 0 0 15px rgba(0,255,204,0.3);
}

nav a {
    margin: 0 1.2rem;
    color: #00ffcc;
    text-decoration: none;
    font-size: 2.1rem;
    padding: 0.6rem 1.4rem;
    border-radius: 10px;
    transition: 0.3s ease;
}

nav a:hover {
    background: rgba(0,255,204,0.15);
    box-shadow: 0 0 14px #00ffcc;
    transform: translateY(-2px);
}

/* ===== CLOCK ===== */
.clock {
    position: fixed;
    top: 20px;
    right: 25px;
    font-family: 'Orbitron', sans-serif;
    font-size: 2.2rem;
    color: #00ffcc;
    text-shadow: 0 0 12px #00ffcc;
}

/* ===== PANEL ===== */
.panel {
    max-width: 900px;
    margin: 120px auto;
    padding: 50px;
    border-radius: 20px;
    background: rgba(0, 10, 20, 0.7);
    backdrop-filter: blur(15px);
    box-shadow: 0 0 35px rgba(0,255,255,0.25);
}

h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 3.6rem;
    text-align: center;
    color: #00ffcc;
    margin-bottom: 40px;
}

/* ===== CONTACT GRID ===== */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 30px;
}

/* CARD IS NOW THE LINK */
.card {
    background: rgba(0,255,255,0.05);
    padding: 30px;
    border-radius: 18px;
    text-align: center;
    transition: 0.3s ease;
    border: 1px solid rgba(0,255,255,0.2);
    text-decoration: none;
    color: white;
    display: block;
}

.card:hover {
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 0 20px rgba(0,255,255,0.6);
}

.card img {
    width: 65px;
    margin-bottom: 15px;
}

.card div {
    font-size: 1.9rem;
    font-weight: 500;
    color: #ffffff;
}

/* ===== RETRO SCANLINES ===== */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        transparent,
        transparent 2px,
        rgba(0,255,255,0.03) 3px
    );
    pointer-events: none;
}
</style>
</head>

<body>

<div class="clock" id="clock"></div>

<nav>
    <a href="index.html" class="hover-sound">Home</a>
    <a href="about.html" class="hover-sound">About</a>
    <a href="work.html" class="hover-sound">Work</a>
    <a href="projects.html" class="hover-sound">Projects</a>
    <a href="blog.html" class="hover-sound">Tech Stack</a>
    <a href="testimonials.html" class="hover-sound">Testimonials</a>
</nav>

<audio id="hover-sound" src="https://css-tricks.com/examples/SoundOnHover/audio/beep.mp3"></audio>

<div class="panel">
    <h1>CONTACT NAVIN</h1>

    <div class="grid">

        <a href="mailto:navinkumarspm@gmail.com" class="card hover-sound">
            <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png">
            <div>Email</div>
        </a>

        <a href="https://www.linkedin.com/in/thenameisnavin/" target="_blank" class="card hover-sound">
            <img src="https://cdn-icons-png.flaticon.com/512/145/145807.png">
            <div>LinkedIn</div>
        </a>

        <a href="https://github.com/TheNameisNavin" target="_blank" class="card hover-sound">
            <img src="https://cdn-icons-png.flaticon.com/512/733/733553.png">
            <div>GitHub</div>
        </a>

        <a href="https://x.com/Monk910355" target="_blank" class="card hover-sound">
            <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png">
            <div>Twitter / X</div>
        </a>

    </div>
</div>

<script>
/* HOVER SOUND */
document.querySelectorAll('.hover-sound').forEach(link => {
    link.addEventListener('mouseover', () => {
        document.getElementById('hover-sound').play();
    });
});

/* CLOCK */
function updateClock(){
    document.getElementById("clock").innerText =
    new Date().toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
