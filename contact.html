<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Navin</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ===== BASE ===== */
body {
    margin: 0;
    font-family: 'Rajdhani', sans-serif;
    background: #000;
    color: #9dfcff;
    overflow-x: hidden;
}

/* ===== TETRIS BACKGROUND ===== */
.tetris-bg {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
}
.block {
    position: absolute;
    width: 20px;
    height: 20px;
    background: rgba(0,255,255,0.15);
    animation: fall linear infinite;
}
@keyframes fall {
    from { transform: translateY(-50px); }
    to { transform: translateY(110vh); }
}

/* ===== NAV (MATRIX STYLE) ===== */
nav {
    background: rgba(0,0,0,0.7);
    padding: 1.2rem;
    text-align: center;
    border-bottom: 1px solid #00ffcc;
}

nav a {
    margin: 0 1rem;
    color: #00ffcc;
    text-decoration: none;
    font-size: 2rem;
    padding: 0.5rem 1.2rem;
    border-radius: 8px;
    transition: 0.3s ease;
}

nav a:hover {
    background: rgba(0,255,204,0.15);
    box-shadow: 0 0 12px #00ffcc;
}

/* ===== CLOCK ===== */
.clock {
    position: fixed;
    top: 20px;
    right: 25px;
    font-family: 'Orbitron', sans-serif;
    font-size: 1.4rem;
    color: #00ffcc;
}

/* ===== HOLOGRAM PANEL ===== */
.panel {
    max-width: 900px;
    margin: 80px auto;
    padding: 40px;
    border-radius: 20px;
    background: rgba(0, 10, 20, 0.65);
    backdrop-filter: blur(15px);
    box-shadow: 0 0 30px rgba(0,255,255,0.3);
}

h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 3.5rem;
    text-align: center;
    color: #00ffcc;
}

/* ===== HOLOGRAPHIC TYPING ===== */
.terminal {
    font-family: monospace;
    background: rgba(0,0,0,0.6);
    padding: 20px;
    border-left: 3px solid #00ffcc;
    margin: 30px 0;
    min-height: 140px;
}

/* ===== CONTACT CARDS ===== */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 25px;
}

.card {
    background: rgba(0,255,255,0.05);
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    transition: 0.3s ease;
    border: 1px solid rgba(0,255,255,0.2);
}

.card:hover {
    transform: translateY(-8px) scale(1.05);
    box-shadow: 0 0 20px rgba(0,255,255,0.5);
}

.card img {
    width: 60px;
}

/* ===== TESTIMONIALS ===== */
.testimonials {
    margin-top: 50px;
    border-top: 1px solid rgba(0,255,255,0.3);
    padding-top: 30px;
}

.testimonial {
    margin: 20px 0;
    font-size: 1.4rem;
    color: #bdfcff;
}

/* ===== SUBMARINE RADAR ===== */
.radar {
    position: fixed;
    bottom: 40px;
    right: 40px;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: 2px solid rgba(0,255,255,0.3);
}
.radar::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(transparent 85%, #00ffcc);
    animation: rotate 3s linear infinite;
}
.radar::after {
    content: "";
    position: absolute;
    inset: 20%;
    border-radius: 50%;
    border: 1px solid rgba(0,255,255,0.4);
}
@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* ===== ROBOT ===== */
.robot {
    position: fixed;
    left: 30px;
    bottom: 30px;
    width: 180px;
    pointer-events: none;
    transition: transform 0.1s ease;
}

/* ===== RETRO STYLE ===== */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        transparent,
        transparent 2px,
        rgba(0,255,255,0.03) 3px
    );
    pointer-events: none;
}
</style>
</head>

<body>

<div class="tetris-bg" id="tetris"></div>

<div class="clock" id="clock"></div>

<nav>
    <a href="index.html" class="hover-sound">Home</a>
    <a href="about.html" class="hover-sound">About</a>
    <a href="work.html" class="hover-sound">Work</a>
    <a href="projects.html" class="hover-sound">Projects</a>
    <a href="blog.html" class="hover-sound">Tech Stack</a>
    <a href="testimonials.html" class="hover-sound">Testimonials</a>
</nav>

<audio id="hover-sound" src="https://css-tricks.com/examples/SoundOnHover/audio/beep.mp3"></audio>

<div class="panel">
    <h1>CONTACT NAVIN</h1>

    <div class="terminal" id="terminal"></div>

    <div class="grid">
        <a class="card hover-sound" href="mailto:navinkumarspm@outlook.com">
            <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png">
            <div>Email</div>
        </a>

        <a class="card hover-sound" href="https://www.linkedin.com/in/thenameisnavin/" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/145/145807.png">
            <div>LinkedIn</div>
        </a>

        <a class="card hover-sound" href="https://github.com/TheNameisNavin" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/733/733553.png">
            <div>GitHub</div>
        </a>

        <a class="card hover-sound" href="https://x.com/Monk910355" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png">
            <div>Twitter / X</div>
        </a>
    </div>

    <div class="testimonials">
        <h2>Testimonials</h2>
        <div class="testimonial">“Navin solves problems faster than most support teams respond.”</div>
        <div class="testimonial">“Exceptional automation mindset and deep SaaS expertise.”</div>
        <div class="testimonial">“Calm, precise, and extremely reliable under pressure.”</div>
    </div>
</div>

<img class="robot" id="robot"
src="https://i.imgur.com/6RMhx.gif">

<div class="radar"></div>

<script>
/* ===== HOVER SOUND ===== */
document.querySelectorAll('.hover-sound').forEach(link => {
    link.addEventListener('mouseover', () => {
        document.getElementById('hover-sound').play();
    });
});

/* ===== CLOCK ===== */
function updateClock(){
    document.getElementById("clock").innerText =
    new Date().toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

/* ===== HOLOGRAPHIC TYPING ===== */
const text = [
"> establishing secure channel...",
"> identity verified: Navin Kumar S",
"> role: SaaS Specialist / Automation Engineer",
"> node: Chennai",
"> status: available for collaboration",
"> awaiting input..."
];

let i=0,j=0;
function type(){
    if(i<text.length){
        if(j<text[i].length){
            document.getElementById("terminal").innerHTML += text[i][j];
            j++;
            setTimeout(type,20);
        } else {
            document.getElementById("terminal").innerHTML += "<br>";
            i++; j=0;
            setTimeout(type,300);
        }
    }
}
type();

/* ===== ROBOT FOLLOW CURSOR ===== */
document.addEventListener("mousemove", e=>{
    const robot = document.getElementById("robot");
    const x = (e.clientX / window.innerWidth - 0.5) * 20;
    const y = (e.clientY / window.innerHeight - 0.5) * 20;
    robot.style.transform = `rotate(${x}deg) translateY(${y}px)`;
});

/* ===== TETRIS BLOCKS ===== */
const container = document.getElementById("tetris");
for(let i=0;i<60;i++){
    const b=document.createElement("div");
    b.className="block";
    b.style.left=Math.random()*100+"vw";
    b.style.animationDuration=(5+Math.random()*10)+"s";
    container.appendChild(b);
}
</script>

</body>
</html>
