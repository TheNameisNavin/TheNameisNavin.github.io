        body {
            margin: 0;

            background-color: #121212;
            color: #ffffff;

        }

        nav {
            background-color: #1f1f1f;
            padding: 1rem;
            text-align: center;
        }

        nav a {
            margin: 0 1rem;
            color: #0F52BA;
            text-decoration: none;
            font-size: 1.8rem;
            transition: transform 0.3s ease, background-color 0.3s ease;
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 5px;
        }

        nav a:hover {
            transform: scale(1.1);
            background-color: #1E90FF;
            color: #ffffff;
        }

        h1 {
            font-size: 3.3rem;
            color: #3B99D8;
            margin-top: 2rem;
            cursor: pointer;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        h1:hover {
            transform: translateY(-10px);
            color: #5BB3E0;
        }

        p {
            font-size: 1.6rem;
            color: #D6E8F7;
            margin: 1.5rem 0;
        }

        .icon-container {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
        }

        .icon-container a {
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease;
        }

        .icon-container a:hover {
            transform: scale(1.2);
        }

        .icon-container img {
            width: 60px;
            height: 60px;
        }

        footer {
            margin-top: 3rem;
            font-size: 1.2rem;
            color: #7BC6E8;
        }
