<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navin's Projects</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    color: #ffe9d6;
    background:
        radial-gradient(circle at 70% 20%, #ff7b3a 0%, #7a2d10 40%, #2a0e05 100%);
    min-height: 100vh;
}

/* NAV */
nav {
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
    padding: 1rem;
    text-align: center;
}

nav a {
    margin: 0 1rem;
    color: #ffb38a;
    text-decoration: none;
    font-size: 1.5rem;
    transition: 0.3s;
}

nav a:hover {
    color: #ffffff;
    text-shadow: 0 0 10px #ff6a00;
}

/* CONTAINER */
.container {
    padding: 2rem;
    max-width: 900px;
    margin: auto;
}

h2, h3 {
    color: #ffd0a8;
    text-shadow: 0 0 15px rgba(255,120,60,0.5);
}

/* PROJECT CARDS */
.project-item {
    background: rgba(0,0,0,0.35);
    padding: 1.5rem;
    border-radius: 12px;
    margin-bottom: 2rem;
    transition: 0.3s;
    border: 1px solid rgba(255,120,60,0.3);
}

.project-item:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 0 25px rgba(255,120,60,0.4);
}

/* CLOCK */
#clock {
    position: fixed;
    top: 15px;
    right: 20px;
    font-size: 1.2rem;
    color: #ffd9c2;
    text-shadow: 0 0 10px #ff6a00;
}

/* ROBOT */
#robot {
    position: fixed;
    top: 10px;
    left: 20px;
    width: 90px;
    height: 90px;
}

.robot-head {
    width: 100%;
    height: 100%;
    background: #1a1a1a;
    border-radius: 15px;
    border: 2px solid #ff6a00;
    position: relative;
    transition: transform 0.1s;
}

.eye {
    width: 14px;
    height: 14px;
    background: #ff6a00;
    border-radius: 50%;
    position: absolute;
    top: 30px;
}

.eye.left { left: 20px; }
.eye.right { right: 20px; }

</style>
</head>

<body>

<div id="clock"></div>

<div id="robot">
    <div class="robot-head" id="head">
        <div class="eye left" id="eyeL"></div>
        <div class="eye right" id="eyeR"></div>
    </div>
</div>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Me</a>
    <a href="work.html">Work Experience</a>
    <a href="blog.html">Technology Stacks</a>
    <a href="testimonials.html">Testimonials</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="container">
    <h2>Projects</h2>

    <div class="project-item">
        <h3>V.I.C.T.O.R 🤖</h3>
        <p><a href="https://github.com/Navinakastark/VICTOR">View Project</a></p>
        <p>Defence robotics platform using embedded systems and long-range control.</p>
    </div>

    <div class="project-item">
        <h3>Spending Insight Pro 💵</h3>
        <p><a href="https://github.com/Navinakastark/datas">View Project</a></p>
        <p>Machine learning model analyzing monthly financial behaviour.</p>
    </div>

</div>

<script>

/* LIVE CLOCK */
function updateClock() {
    const now = new Date();
    document.getElementById("clock").innerText =
        now.toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

/* ROBOT FOLLOW CURSOR */
document.addEventListener("mousemove", e => {

    const eyes = [eyeL, eyeR];

    eyes.forEach(eye => {
        const rect = eye.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width/2;
        const y = e.clientY - rect.top - rect.height/2;
        const angle = Math.atan2(y, x);
        eye.style.transform = `translate(${Math.cos(angle)*4}px, ${Math.sin(angle)*4}px)`;
    });

    const head = document.getElementById("head");
    const moveX = (e.clientX / window.innerWidth - 0.5) * 20;
    const moveY = (e.clientY / window.innerHeight - 0.5) * 20;
    head.style.transform = `rotateY(${moveX}deg) rotateX(${-moveY}deg)`;
});

</script>

</body>
</html>
